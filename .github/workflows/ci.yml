name: QIDS-CAM verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install setuptools==84.0.0 wheel twine
      - run: python scripts/build_release.py
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - run: python scripts/release_gate.py --report .verification/release-gate.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.python }}-evidence
          path: .verification/release-gate.json
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python scripts/export_examples.py
      - run: npm test
