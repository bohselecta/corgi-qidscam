name: Release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install setuptools==84.0.0 wheel twine
      - run: python scripts/build_release.py
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - run: python scripts/release_gate.py
      - run: cp dist/SHA256SUMS /tmp/first-build-checksums
      - run: python scripts/build_release.py
      - run: cmp /tmp/first-build-checksums dist/SHA256SUMS
      - name: Publish approved tag artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_REF_NAME" = "v0.2.0"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --title "QIDS-CAM 0.2.0" \
              --notes-file docs/RELEASE-NOTES-0.2.0.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: qids-cam-0.2.0
          path: dist/
